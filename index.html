                    </div>
                `, true);
            };

            // ==========================================================
            // LABORATÓRIO
            // ==========================================================
            function pageLaboratorio() {
                const ops = getStorage(KEYS.OPS).map(normalizarStatusOP);
                const pend = ops.filter(o => o.status === 'Em Laboratório');
                let lista = pend.length === 0
                    ? `<div class="empty-state"><i class="fas fa-microscope"></i><p>Nenhuma OP</p></div>`
                    : pend.map(o => `<div class="card" style="background: var(--fundo-claro); box-shadow: none; margin-bottom: 1rem;">
                        <div class="flex-between">
                            <div><h4 style="color: var(--azul-escuro);">${o.numero} - ${escapeHtml(o.produto)}</h4>
                                <div class="text-small">Qtd: ${o.quantidade} | Lote: ${escapeHtml(o.lote)}</div></div>
                            <button class="btn btn-success" onclick="abrirLaboratorio('${o.id}')"><i class="fas fa-microscope"></i> Analisar</button>
                        </div></div>`).join('');
                return `<div class="card"><div class="card-header"><div class="card-title"><i class="fas fa-microscope"></i> Laboratório</div></div>${lista}</div>`;
            }

            window.abrirLaboratorio = function(id) {
                const op = getStorage(KEYS.OPS).find(o => o.id === id);
                if (!op) return;
                let regs = '';
                if (op.registros) {
                    for (const [s, d] of Object.entries(op.registros)) {
                        regs += `<h4 style="color: var(--azul-escuro); margin: 1rem 0 0.5rem;">${s.toUpperCase()}</h4>
                            <div class="info-grid">
                                <div class="info-block"><div class="info-block-label">Início</div><div class="info-block-value">${d.inicio?.hora || '-'}</div></div>
                                <div class="info-block"><div class="info-block-label">Término</div><div class="info-block-value">${d.fim?.hora || '-'}</div></div>
                                <div class="info-block"><div class="info-block-label">Tempo</div><div class="info-block-value">${d.fim?.tempoDecorrido || '-'}</div></div>
                                <div class="info-block"><div class="info-block-label">Operador</div><div class="info-block-value">${escapeHtml(d.fim?.operador || '-')}</div></div>
                            </div>`;
                    }
                }
                let qual = op.qualidade ? `<h4 style="color: var(--roxo); margin: 1rem 0 0.5rem;"><i class="fas fa-vial"></i> Qualidade</h4>
                    <div class="info-grid"><div class="info-block"><div class="info-block-label">Analisado por</div><div class="info-block-value">${escapeHtml(op.qualidade.analisadoPor)}</div></div>
                    <div class="info-block"><div class="info-block-label">Resultado</div><div class="info-block-value">${escapeHtml(op.qualidade.resultado)}</div></div></div>` : '';

                openModal(`
                    <div class="modal-header"><h3><i class="fas fa-microscope"></i> ${op.numero}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
                    <div class="info-grid">
                        <div class="info-block"><div class="info-block-label">Produto</div><div class="info-block-value">${escapeHtml(op.produto)}</div></div>
                        <div class="info-block"><div class="info-block-label">Qtd</div><div class="info-block-value">${op.quantidade}</div></div>
                        <div class="info-block"><div class="info-block-label">Lote</div><div class="info-block-value">${escapeHtml(op.lote)}</div></div>
                    </div>
                    ${regs}${qual}
                    <form onsubmit="encerrarOP(event, '${id}')" style="margin-top: 1rem;">
                        <div class="form-grid">
                            <div class="form-group"><label>Analisado por *</label><input type="text" name="analisadoPor" required value="${escapeHtml(currentUser.nome)}"></div>
                            <div class="form-group" style="grid-column: 1 / -1;"><label>Observações</label><textarea name="observacoes" rows="2"></textarea></div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-success"><i class="fas fa-check-circle"></i> Encerrar</button>
                            <button type="button" class="btn btn-danger" onclick="closeModal(); retrocederProcesso('${op.id}')"><i class="fas fa-undo"></i> Retroceder</button>
                            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                        </div>
                    </form>
                `, true);
            };

            window.encerrarOP = function(e, id) {
                e.preventDefault();
                const d = Object.fromEntries(new FormData(e.target));
                const ops = getStorage(KEYS.OPS);
                const op = ops.find(o => o.id === id);
                if (!op) return;
                op.laboratorio = { analisadoPor: d.analisadoPor, dataAnalise: new Date().toISOString(), observacoes: d.observacoes };
                op.status = 'Encerrada';
                op.historico = op.historico || [];
                op.historico.push({ setor: currentUser.nome, acao: 'OP encerrada', timestamp: new Date().toISOString() });
                setStorage(KEYS.OPS, ops);
                registrarLog('OP Encerrada', `${op.numero}`, 'verde');
                closeModal();
                renderPage(currentPage);
                alert('✅ OP encerrada!');
            };

            // ==========================================================
            // INICIAR TRABALHO (operário)
            // ==========================================================
            window.iniciarTrabalho = function(opId) {
                const op = getStorage(KEYS.OPS).find(o => o.id === opId);
                if (!op) return;
                const ms = getStorage(KEYS.MISTURADORES, MISTURADORES_DEFAULT);
                const minha = ms.find(m => m.operador === currentUser.email);
                if (!minha) { alert('Registre-se em uma máquina primeiro.'); return; }
                const setor = currentUser.setor;
                const config = getConfigSetor(setor, op);
                const agora = new Date();
                const hora = agora.toLocaleTimeString('pt-BR');
                const data = agora.toLocaleDateString('pt-BR');
                const dataCompleta = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
                const tMin = getTempoMinimoSeg(op, setor);

                openModal(`
                    <div class="modal-header"><h3><i class="fas ${config.icon}"></i> Iniciar ${config.nomeTarefa}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
                    <div class="info-grid">
                        <div class="info-block"><div class="info-block-label">OP</div><div class="info-block-value">${op.numero}</div></div>
                        <div class="info-block"><div class="info-block-label">Produto</div><div class="info-block-value">${escapeHtml(op.produto)}</div></div>
                        <div class="info-block"><div class="info-block-label">Máquina</div><div class="info-block-value">${escapeHtml(minha.nome)}</div></div>
                    </div>
                    <div class="clock-display" style="padding: 1.5rem;">
                        <div class="clock-label"><i class="fas fa-play-circle"></i> Início Automático</div>
                        <div class="clock-time" style="font-size: 2.5rem;">${hora}</div>
                        <div class="clock-date">${dataCompleta}</div>
                    </div>
                    ${tMin ? `<div class="alert alert-warning"><i class="fas fa-lock"></i><strong>Tempo mínimo: ${fmtMinSeg(tMin)}</strong></div>` : ''}
                    <div class="form-actions">
                        <button class="btn btn-success btn-xl" onclick="confirmarInicio('${op.id}', '${hora}', '${data}', '${agora.toISOString()}')"><i class="fas fa-play"></i> Confirmar Início</button>
                        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    </div>
                `, true);
            };

            window.confirmarInicio = function(opId, hora, data, ts) {
                const ops = getStorage(KEYS.OPS);
                const op = ops.find(o => o.id === opId);
                if (!op) return;
                const setor = currentUser.setor;
                const ms = getStorage(KEYS.MISTURADORES, MISTURADORES_DEFAULT);
                const minha = ms.find(m => m.operador === currentUser.email);
                op.status = setor === 'mistura' ? 'Em Mistura' : 'Em Envase';
                op.operadorAtual = currentUser.email;
                op.inicioTrabalho = { hora, data, timestamp: ts, operador: currentUser.nome, setor, tempoMinimoSeg: getTempoMinimoSeg(op, setor), maquina: minha?.nome || null };
                op.historico = op.historico || [];
                op.historico.push({ setor: currentUser.nome, acao: `${getConfigSetor(setor).nomeTarefa} iniciado`, timestamp: ts });
                if (minha) { minha.opAtual = op.numero; setStorage(KEYS.MISTURADORES, ms); }
                setStorage(KEYS.OPS, ops);
                registrarLog('Trabalho Iniciado', `${op.numero}`, 'info');
                closeModal();
                renderPage(currentPage);
                iniciarTempoDecorrido(opId);
            };

            function getConfigSetor(setor, op) {
                const c = {
                    mistura: { nomeTarefa: 'Mistura', icon: 'fa-flask' },
                    envase: { nomeTarefa: 'Envase', icon: 'fa-fill-drip' }
                };
                return c[setor] || c.mistura;
            }

            function iniciarTempoDecorrido(opId) {
                const iid = 'tempo-' + opId;
                if (relogioIntervals[iid]) clearInterval(relogioIntervals[iid]);
                function atualizar() {
                    const el = document.getElementById('tempo-' + opId);
                    if (!el) { clearInterval(relogioIntervals[iid]); return; }
                    const ops = getStorage(KEYS.OPS);
                    const op = ops.find(o => o.id === opId);
                    if (!op || !op.inicioTrabalho) return;
                    el.textContent = calcularTempoDecorrido(op.inicioTrabalho.timestamp);
                }
                atualizar();
                relogioIntervals[iid] = setInterval(atualizar, 1000);
            }

            // ==========================================================
            // TERMINAR
            // ==========================================================
            window.abrirTelaTerminar = function(opId) {
                const op = getStorage(KEYS.OPS).find(o => o.id === opId);
                if (!op) return;
                const setor = currentUser.setor;
                const config = getConfigSetor(setor, op);
                const falta = getTempoMinimoSeg(op, setor) - getSegDecorridos(op);
                if (falta > 0) { alert(`⏳ Faltam ${fmtMinSeg(falta)}`); return; }
                const agora = new Date();
                const horaFim = agora.toLocaleTimeString('pt-BR');
                const dataFim = agora.toLocaleDateString('pt-BR');
                const td = calcularTempoDecorrido(op.inicioTrabalho?.timestamp);

                let campos = '';
                if (setor === 'mistura') {
                    campos = `<h4 style="color: var(--azul-escuro); margin: 1rem 0 0.5rem;">Dados da Mistura</h4>
                        <div class="form-grid">
                            <div class="form-group"><label>Densidade Inicial *</label><input type="number" name="densidadeInicial" step="0.01" required></div>
                            <div class="form-group"><label>Densidade Final *</label><input type="number" name="densidadeFinal" step="0.01" required></div>
                            <div class="form-group"><label>pH *</label><input type="number" name="ph" step="0.1" required></div>
                            <div class="form-group"><label>Placas *</label><select name="placas" required><option value="">Selecione</option><option>Aprovadas</option><option>Reprovadas</option><option>Com Ressalvas</option></select></div>
                        </div>`;
                } else if (setor === 'envase') {
                    campos = `<h4 style="color: var(--azul-escuro); margin: 1rem 0 0.5rem;">Dados do Envase</h4>
                        <div class="form-grid">
                            <div class="form-group"><label>Misturador *</label><select name="misturador" required><option value="">Selecione</option><option>Misturador 01</option><option>Misturador 02</option><option>Misturador 03</option></select></div>
                            <div class="form-group"><label>Quantidade Envasada *</label><input type="number" name="quantidadeEnvasada" min="0" required value="0"></div>
                        </div>`;
                }

                openModal(`
                    <div class="modal-header"><h3><i class="fas fa-stop-circle"></i> Terminar ${config.nomeTarefa}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
                    <div class="painel-andamento"><div class="label"><i class="fas fa-play-circle"></i> Início</div><div class="hora-grande">${op.inicioTrabalho?.hora}</div><div class="data-info">${op.inicioTrabalho?.data} • ${escapeHtml(op.inicioTrabalho?.operador || '')}</div></div>
                    <div class="painel-andamento" style="background: linear-gradient(135deg, #1e6b3b, #155d32);"><div class="label"><i class="fas fa-stop-circle"></i> Término</div><div class="hora-grande">${horaFim}</div><div class="data-info">${dataFim}</div></div>
                    <div class="tempo-decorrido"><div class="label"><i class="fas fa-stopwatch"></i> Tempo</div><div class="valor">${td}</div></div>
                    <form onsubmit="finalizarTrabalho(event, '${op.id}', '${horaFim}', '${dataFim}', '${agora.toISOString()}', '${td}')">
                        ${campos}
                        <div class="form-actions" style="margin-top: 1.5rem;">
                            <button type="submit" class="btn btn-success btn-xl"><i class="fas fa-check-circle"></i> Confirmar</button>
                            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                        </div>
                    </form>
                `, true);
            };

            window.finalizarTrabalho = function(e, opId, horaFim, dataFim, tsFim, td) {
                e.preventDefault();
                const d = Object.fromEntries(new FormData(e.target));
                const ops = getStorage(KEYS.OPS);
                const op = ops.find(o => o.id === opId);
                if (!op) return;
                const setor = currentUser.setor;
                op.fimTrabalho = { hora: horaFim, data: dataFim, timestamp: tsFim, operador: currentUser.nome, setor, tempoDecorrido: td };
                op.registros = op.registros || {};
                op.registros[setor] = { inicio: op.inicioTrabalho, fim: op.fimTrabalho, dados: d };
                if (setor === 'mistura') op.status = 'Em Qualidade';
                else if (setor === 'envase') op.status = 'Em Laboratório';
                delete op.operadorAtual;

                if (setor === 'envase') {
                    const env = parseInt(d.quantidadeEnvasada) || 0;
                    const perdaQtd = op.quantidade - env;
                    if (perdaQtd > 0) {
                        const ps = getStorage(KEYS.PERDAS);
                        const nova = { id: gerarId(), opNumero: op.numero, produtoNome: op.produto, setor: 'Envase', qtd: perdaQtd, motivo: 'Diferença', percentual: parseFloat(((perdaQtd / op.quantidade) * 100).toFixed(1)), data: new Date().toISOString() };
                        ps.push(nova);
                        setStorage(KEYS.PERDAS, ps);
                        enviarPerdaParaPA(nova);
                    }
                }

                op.historico = op.historico || [];
                op.historico.push({ setor: currentUser.nome, acao: `${getConfigSetor(setor).nomeTarefa} finalizado`, timestamp: tsFim });

                setStorage(KEYS.OPS, ops);
                registrarLog('Trabalho Finalizado', `${op.numero} - ${setor}`, 'verde');

                const ms = getStorage(KEYS.MISTURADORES, MISTURADORES_DEFAULT);
                const m = ms.find(x => x.operador === currentUser.email);
                if (m) { m.opAtual = null; setStorage(KEYS.MISTURADORES, ms); }

                closeModal();
                renderPage(currentPage);
                alert('✅ Finalizado!');
            };

                        </div>
                    </form>
                `);
            };

            window.salvarMisturador = function(e, id) {
                e.preventDefault();
                const d = Object.fromEntries(new FormData(e.target));
                const ms = getStorage(KEYS.MISTURADORES, MISTURADORES_DEFAULT);
                const i = ms.findIndex(x => x.id === id);
                if (i === -1) return;
                ms[i] = { ...ms[i], ...d };
                setStorage(KEYS.MISTURADORES, ms);
                closeModal();
                renderPage(currentPage);

                if (currentUser.cargo !== 'admin') return;
                openModal(`
                    <div class="modal-header"><h3><i class="fas fa-plus-circle"></i> Novo</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>

                `);

                return `<div class="card"><div class="card-header"><div class="card-title"><i class="fas fa-barcode"></i> Lotes</div></div>
                    <div class="table-responsive"><table><thead><tr><th>Lote</th><th>Produto</th><th>Setor</th><th>Qtd</th><th>Status</th></tr></thead>
                    <tbody>${l.length === 0 ? '<tr><td colspan="5" class="empty-state"><p>Nenhum lote</p></td></tr>' : l.map(x => `<tr><td><strong>${escapeHtml(x.codigo)}</strong></td><td>${escapeHtml(x.produtoNome)}</td><td>${escapeHtml(x.setor)}</td><td>${x.quantidade}</td><td><span class="badge">${escapeHtml(x.status)}</span></td></tr>`).join('')}</tbody></table></div></div>`;
            }

            function pagePerdas() {
                const p = getStorage(KEYS.PERDAS).slice().reverse();
                const pode = currentUser.podeExcluir;
                const lista = p.length === 0 ? '<div class="empty-state"><i class="fas fa-trash-alt"></i><p>Nenhuma perda</p></div>' :
                    p.map(x => `<div class="linha-metrica">
                        <div style="min-width:200px;"><div style="font-weight:600;">${escapeHtml(x.produtoNome || '-')}</div><div class="text-small">${escapeHtml(x.motivo || '')} • ${formatDateTime(x.data)}</div></div>
                        <div style="display:flex; align-items:center; gap:10px; flex:1; min-width:200px;">
                            <span class="text-small" style="min-width:70px;">${escapeHtml(x.setor || '')}</span>
                            <div class="barra-progresso"><div class="barra-preenchimento" style="width:${Math.min((x.percentual || 0) * 10, 100)}%; background:${x.percentual > 3 ? 'var(--vermelho)' : 'var(--cinza-aco)'};"></div></div>
                            <span style="font-weight:700; color: var(--azul-escuro); min-width:80px; text-align:right;">${x.qtd} un • ${x.percentual}%</span>
                        </div>
                        ${pode ? `<button class="btn btn-sm btn-danger" onclick="excluirPerda('${x.id}')"><i class="fas fa-trash"></i></button>` : ''}
                    </div>`).join('');
                return `<div class="card"><div class="card-header"><div class="card-title"><i class="fas fa-trash-alt"></i> Perdas</div></div>${lista}</div>`;
            }

            window.excluirPerda = function(id) {
                if (!currentUser.podeExcluir) return;
                if (!confirm('Excluir?')) return;
                setStorage(KEYS.PERDAS, getStorage(KEYS.PERDAS).filter(p => p.id !== id));
                renderPage(currentPage);
            };

            function pageEficiencia() {
                const ef = calcularEficiencia();
                return `<div class="card"><div class="card-header"><div class="card-title"><i class="fas fa-tachometer-alt"></i> Eficiência</div></div>
                    <div class="kpi-grid">
                        <div class="kpi-item"><div class="kpi-value">${ef.rendimento}%</div><div class="kpi-label">Rendimento</div></div>
                        <div class="kpi-item"><div class="kpi-value">${ef.perdaMedia}%</div><div class="kpi-label">Perda Média</div></div>
                    </div></div>`;
            }

            function pageChatEmbed() {
                return `<div class="card"><div class="card-header"><div class="card-title"><i class="fas fa-comments"></i> Chat</div></div>
                    <div class="alert alert-info"><i class="fas fa-info-circle"></i> Use o botão flutuante.</div></div>`;
            }

            function calcularEficiencia() {
                const ops = getStorage(KEYS.OPS).map(normalizarStatusOP);
                const perdas = getStorage(KEYS.PERDAS);
                const cE = ops.filter(o => o.registros?.envase?.dados);
                const pl = cE.reduce((a, o) => a + (o.quantidade || 0), 0);
                const en = cE.reduce((a, o) => a + (parseInt(o.registros.envase.dados.quantidadeEnvasada) || 0), 0);
                return {
                    rendimento: pl ? Math.min(100, (en / pl) * 100).toFixed(1) : '100.0',
                    perdaMedia: perdas.length ? (perdas.reduce((a, p) => a + (p.percentual || 0), 0) / perdas.length).toFixed(1) : '0.0',
                    encerradas: ops.filter(o => o.status === 'Encerrada').length
                };
            }

            // ==========================================================
            // POWER AUTOMATE
            // ==========================================================
            async function chamarPowerAutomate(url, payload) {
                if (!PA_CONFIGURADO || !url || url.includes('SUBSTITUA_AQUI')) return null;
                try {
                    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    return await r.json().catch(() => ({}));
                } catch (e) { return null; }
            }

            function enviarPerdaParaPA(p) { return chamarPowerAutomate(POWER_AUTOMATE.WEBHOOK_PERDAS, { tipo: 'PERDA_REGISTRADA', ...p }); }
            function verificarEstoqueBaixo() {
                const ps = getStorage(KEYS.PRODUTOS);
                const c = ps.filter(p => (p.estoque || 0) < 100);
                if (c.length === 0) return null;
                return chamarPowerAutomate(POWER_AUTOMATE.WEBHOOK_ESTOQUE, { produtos: c });
            }

            // ==========================================================
            // CHAT
            // ==========================================================
            function renderChatComIA() {
                const c = $('#chatMessages');
                if (!c) return;
                const tS = $('#tabSetores'), tI = $('#tabIA'), sB = $('#chatSetores'), iB = $('#iaAviso');
                if (tS) tS.classList.toggle('ativo', !chatIAModo);
                if (tI) tI.classList.toggle('ativo', chatIAModo);
                if (sB) sB.classList.toggle('hidden', chatIAModo);
                if (iB) iB.classList.toggle('hidden', !chatIAModo);

                if (chatIAModo) {
                    const h = getStorage(KEYS.CHAT_IA);
                    c.innerHTML = h.length === 0 ? `<div class="empty-state" style="padding:2rem 1rem;"><i class="fas fa-robot" style="color:var(--azul-escuro);"></i><p>IA Assistente</p></div>` :
                        h.map(m => `<div class="message ${m.role === 'user' ? 'message-out' : 'message-ia'}"><div class="message-info"><span><i class="fas ${m.role === 'user' ? 'fa-user-circle' : 'fa-robot'}"></i> ${m.role === 'user' ? 'Você' : 'IA'}</span><span>${formatDateTime(m.timestamp)}</span></div><div>${escapeHtml(m.text)}</div></div>`).join('');
                } else {
                    const ms = getStorage(KEYS.CHAT);
                    const f = setorSelecionado === 'todos' ? ms : ms.filter(m => m.target === setorSelecionado || m.sender === setorSelecionado);
                    c.innerHTML = f.length === 0 ? '<div class="empty-state" style="padding:2rem 1rem;"><i class="fas fa-comments"></i><p>Nenhuma mensagem</p></div>' :
                        f.map(m => `<div class="message ${m.type === 'out' ? 'message-out' : 'message-in'}"><div class="message-info"><span><i class="fas fa-user-circle"></i> ${escapeHtml(m.sender)}${m.target ? ' → ' + escapeHtml(m.target) : ''}</span><span>${formatDateTime(m.timestamp)}</span></div><div>${escapeHtml(m.text)}</div></div>`).join('');
                }
                c.scrollTop = c.scrollHeight;
            }

            window.setChatModo = function(m) { chatIAModo = m; renderChatComIA(); };
            window.mudarSetorChat = function(s) { setorSelecionado = s; renderChatComIA(); };

            async function sendChatMessageComIA() {
                if (!currentUser) return;
                const inp = $('#chatInput');
                const t = inp.value.trim();
                if (!t) return;
                inp.value = '';

                if (chatIAModo) {
                    const h = getStorage(KEYS.CHAT_IA);
                    h.push({ role: 'user', text: t, timestamp: new Date().toISOString() });
                    setStorage(KEYS.CHAT_IA, h);
                    renderChatComIA();
                    const r = await chamarPowerAutomate(POWER_AUTOMATE.WEBHOOK_CHAT_IA, { mensagem: t, setor: currentUser.cargoLabel });
                    const txt = (r && (r.resposta || r.texto)) || '⚠️ IA indisponível.';
                    h.push({ role: 'assistant', text: txt, timestamp: new Date().toISOString() });
                    setStorage(KEYS.CHAT_IA, h);
                    renderChatComIA();
                } else {
                    const ms = getStorage(KEYS.CHAT);
                    ms.push({ id: gerarId(), text: t, sender: currentUser.cargoLabel, target: setorSelecionado === 'todos' ? null : setorSelecionado, email: currentUser.email, timestamp: new Date().toISOString(), type: 'out' });
                    setStorage(KEYS.CHAT, ms);
                    renderChatComIA();
                    updateChatBadge();
                }
            }

            function toggleChat() {
                chatOpen = !chatOpen;
                $('#chatPanel').classList.toggle('open', chatOpen);
                if (chatOpen) { renderChatComIA(); updateChatBadge(); setTimeout(() => $('#chatInput').focus(), 300); }
            }

            function updateChatBadge() {
                const ms = getStorage(KEYS.CHAT);
                const b = $('#chatBadge');
                if (!b) return;
                if (!chatOpen && ms.length > 0) { b.textContent = ms.length > 9 ? '9+' : ms.length; b.classList.remove('hidden'); }
                else b.classList.add('hidden');
            }

            // ==========================================================
            // ATTACH
            // ==========================================================
            function attachPageEvents(k) {
                if (k === 'ops_pcp') {
                    const b = $('#btnNovaOP');
                    if (b) b.addEventListener('click', novaOP);
                }
                if (k === 'inicio') setTimeout(() => iniciarRelogio('relogioGestor'), 50);
                if (k === 'inicio_operario') {
                    setTimeout(() => iniciarRelogio('relogioOperario'), 50);
                    const ops = getStorage(KEYS.OPS).map(normalizarStatusOP);
                    const st = currentUser.setor === 'mistura' ? 'Em Mistura' : 'Em Envase';
                    ops.filter(o => o.status === st && o.operadorAtual === currentUser.email).forEach(o => iniciarTempoDecorrido(o.id));
                }
            }

            function iniciarRelogio(id) {
                if (relogioIntervals[id]) clearInterval(relogioIntervals[id]);
                function at() {
                    const el = document.getElementById(id);
                    if (!el) return;
                    const a = new Date();
                    const t = el.querySelector('.clock-time');
                    const d = el.querySelector('.clock-date');
                    if (t) t.textContent = a.toLocaleTimeString('pt-BR');
                    if (d) d.textContent = a.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
                }
                at();
                relogioIntervals[id] = setInterval(at, 1000);
            }

            // ==========================================================
            // NOVA OP
            // ==========================================================
            function novaOP() {
                if (currentUser.cargo !== 'pcp' && currentUser.cargo !== 'admin') return;
                const n = 'OP-' + new Date().getFullYear() + '-' + String(getStorage(KEYS.OPS).length + 1).padStart(3, '0');
                openModal(`
                    <div class="modal-header"><h3><i class="fas fa-clipboard-list"></i> Nova OP</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
                    <form onsubmit="salvarOP(event)">
                        <div class="form-grid">
                            <div class="form-group"><label>Nº OP *</label><input type="text" name="numero" required value="${n}"></div>
                            <div class="form-group"><label>Produto *</label><select name="produto" required>${Object.keys(CATALOGO).map(p => `<option>${p}</option>`).join('')}</select></div>
                            <div class="form-group"><label>Quantidade *</label><input type="number" name="quantidade" min="1" required value="100"></div>
                            <div class="form-group"><label>Lote *</label><input type="text" name="lote" required value="LOTE-${Date.now().toString().slice(-6)}"></div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Gerar</button>
                            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                        </div>
                    </form>
                `);
            }

            window.salvarOP = function(e) {
                e.preventDefault();
                const d = Object.fromEntries(new FormData(e.target));
                const ops = getStorage(KEYS.OPS);
                ops.push({
                    id: gerarId(), numero: d.numero, produto: d.produto,
                    quantidade: parseInt(d.quantidade), lote: d.lote,
                    criadoEm: new Date().toISOString(), criadoPor: currentUser.nome,
                    status: 'Aguardando Mistura',
                    historico: [{ setor: currentUser.nome, acao: 'OP criada', timestamp: new Date().toISOString() }]
                });
                setStorage(KEYS.OPS, ops);
                registrarLog('OP Criada', `${d.numero}`, 'verde');
                closeModal();
                renderPage(currentPage);
            };

            // ==========================================================
            // MODAL
            // ==========================================================
            function openModal(html, large = false) {
                $('#modalContent').innerHTML = html;
                $('#modalContent').className = 'modal' + (large ? ' modal-lg' : '');
                $('#modalOverlay').classList.remove('hidden');
            }
            window.closeModal = function() {
                $('#modalOverlay').classList.add('hidden');
                $('#modalContent').innerHTML = '';
            };

            // ==========================================================
            // SEED (mantém compatibilidade com dados legados)
            // ==========================================================
            function seedData() {
                if (getStorage(KEYS.USUARIOS).length === 0) setStorage(KEYS.USUARIOS, USUARIOS_DEFAULT);
                if (getStorage(KEYS.MISTURADORES).length === 0) setStorage(KEYS.MISTURADORES, MISTURADORES_DEFAULT);
                if (getStorage(KEYS.PERDAS).length === 0) setStorage(KEYS.PERDAS, []);
                if (getStorage(KEYS.LOGS).length === 0) setStorage(KEYS.LOGS, []);
                if (getStorage(KEYS.PRODUTOS).length === 0) {
                    const prods = Object.entries(CATALOGO).map(([nome, c], i) => ({
                        id: 'p' + (i + 1), codigo: c.codigo, nome, categoria: c.categoria,
                        estoque: c.estoque, preco: c.preco
                    }));
                    setStorage(KEYS.PRODUTOS, prods);
                }
                if (getStorage(KEYS.OPS).length === 0) {
                    setStorage(KEYS.OPS, [
                        { id: gerarId(), numero: 'OP-2025-001', produto: 'Massa para Drywall 20kg', quantidade: 500, lote: 'LOTE-2025-001', criadoEm: new Date().toISOString(), criadoPor: 'Sistema', status: 'Aguardando Mistura', historico: [] },
                        { id: gerarId(), numero: 'OP-2025-002', produto: 'Massa para Junta 18kg', quantidade: 300, lote: 'LOTE-2025-002', criadoEm: new Date().toISOString(), criadoPor: 'Sistema', status: 'Aguardando Mistura', historico: [] }
                    ]);
                }
                if (getStorage(KEYS.LOTES).length === 0) setStorage(KEYS.LOTES, []);
                if (getStorage(KEYS.ENTRADAS).length === 0) setStorage(KEYS.ENTRADAS, []);
                if (getStorage(KEYS.SAIDAS).length === 0) setStorage(KEYS.SAIDAS, []);
                if (getStorage(KEYS.CHAT).length === 0) setStorage(KEYS.CHAT, []);
            }

            // ==========================================================
            // BIND / INIT
            // ==========================================================
            function bindEvents() {
                $('#btnLogin').addEventListener('click', performLogin);
                $('#loginPassword').addEventListener('keypress', e => { if (e.key === 'Enter') performLogin(); });
                $('#btnLogout').addEventListener('click', performLogout);
                $('#chatToggle').addEventListener('click', toggleChat);
                $('#btnSendMessage').addEventListener('click', sendChatMessageComIA);
                $('#chatInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendChatMessageComIA(); });
                $('#modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') closeModal(); });
                window.addEventListener('storage', e => {
                    if (!currentUser) return;
                    if (e.key && e.key.startsWith('multiperfil_')) {
                        renderPage(currentPage);
                        renderChatComIA();
                        updateChatBadge();
                    }
                });
                document.addEventListener('click', e => {
                    if (!chatOpen) return;
                    const p = $('#chatPanel'), t = $('#chatToggle');
                    if (!p.contains(e.target) && !t.contains(e.target)) { chatOpen = false; p.classList.remove('open'); }
                });
            }

            function init() {
                seedData();
                popularLogin();
                bindEvents();
                window.switchPage = switchPage;
                if (!PA_CONFIGURADO) console.warn('⚠️ Power Automate não configurado');
            }

            init();
        })();
    </script>
</body>
</html>
