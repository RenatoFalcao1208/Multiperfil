<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiperfil • Sistema de Produção v9.1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }

        :root {
            --azul-escuro: #0050A0;
            --azul-medio: #004395;
            --cinza-aco: #728A9C;
            --cinza-aco2: #788E9E;
            --branco: #FFFFFF;
            --sombra: 0 8px 20px rgba(0, 0, 0, 0.06);
            --sombra-forte: 0 15px 35px rgba(0, 0, 0, 0.15);
            --borda: #e9eef3;
            --fundo-claro: #f8fafd;
            --verde: #1e6b3b;
            --verde-claro: #e2f0e8;
            --amarelo: #b45f06;
            --amarelo-claro: #fff3e0;
            --vermelho: #c0392b;
            --vermelho-claro: #fde8e8;
            --roxo: #6b3fa0;
            --roxo-claro: #f0e8f8;
        }

        body { background-color: var(--branco); color: #1e2b37; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* ============ LOGIN ============ */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #004395 0%, #0050A0 100%);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 1rem; overflow-y: auto;
        }
        .login-card {
            background: white; max-width: 560px; width: 100%; padding: 2.5rem 2rem;
            border-radius: 32px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
            text-align: center; animation: slideUp 0.5s ease;
            max-height: 95vh; overflow-y: auto;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .login-card .logo-icon {
            margin: 0 auto 16px; width: 70px; height: 70px;
            background: var(--cinza-aco2); color: white;
            border-radius: 16px 16px 6px 6px;
            display: flex; align-items: center; justify-content: center; font-size: 2rem;
        }
        .login-card h2 { color: var(--azul-escuro); margin-bottom: 4px; font-size: 1.8rem; letter-spacing: -0.5px; }
        .login-card p.slogan { color: var(--azul-medio); font-size: 0.7rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 20px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--azul-escuro); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input, .input-group select {
            width: 100%; padding: 14px 16px; border: 1.5px solid #d0dbe8;
            border-radius: 14px; font-size: 0.95rem; outline: none; transition: 0.2s; background: white;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--azul-escuro); box-shadow: 0 0 0 4px rgba(0, 80, 160, 0.1); }
        .btn-login { background: var(--azul-escuro); color: white; border: none; width: 100%; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .btn-login:hover { background: var(--azul-medio); transform: translateY(-2px); }
        .login-error { color: var(--vermelho); font-size: 0.8rem; margin-top: 12px; min-height: 20px; }
        .demo-emails { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--borda); text-align: left; max-height: 300px; overflow-y: auto; }
        .demo-emails h4 { font-size: 0.75rem; color: var(--azul-escuro); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; position: sticky; top: 0; background: white; padding-bottom: 6px; }
        .demo-email-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; border-radius: 10px; margin-bottom: 6px;
            background: var(--fundo-claro); cursor: pointer; transition: 0.2s;
            border: 1.5px solid transparent; font-size: 0.78rem;
        }
        .demo-email-item:hover { border-color: var(--azul-escuro); background: #eef3f9; }
        .demo-email-item .role { font-weight: 700; color: var(--azul-escuro); font-size: 0.7rem; text-transform: uppercase; }
        .demo-email-item .email { color: var(--cinza-aco2); font-size: 0.72rem; }
        .legacy-badge { background: var(--amarelo-claro); color: var(--amarelo); padding: 2px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; margin-left: 6px; }

        /* ============ APP ============ */
        .app-container { display: flex; flex-direction: column; min-height: 100vh; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem 1.5rem; background: var(--branco);
            border-bottom: 3px solid var(--azul-escuro);
            flex-wrap: wrap; gap: 1rem;
            box-shadow: 0 2px 10px rgba(0, 80, 160, 0.05);
            position: sticky; top: 0; z-index: 100;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            background: var(--cinza-aco2); color: white; padding: 6px 8px;
            border-radius: 12px 12px 4px 4px; font-size: 1.4rem;
            width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .brand { display: flex; flex-direction: column; }
        .brand-name { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; color: var(--azul-escuro); line-height: 1; }
        .brand-slogan { font-size: 0.6rem; font-weight: 600; letter-spacing: 1.2px; color: var(--azul-medio); text-transform: uppercase; margin-top: 2px; }
        .user-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .role-badge {
            background: var(--azul-escuro); color: white; padding: 4px 12px;
            border-radius: 30px; font-size: 0.7rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 6px;
        }
        .user-badge {
            display: flex; align-items: center; gap: 8px;
            background: #eef3f9; padding: 6px 14px; border-radius: 40px;
            color: var(--azul-escuro); font-weight: 500; font-size: 0.85rem;
        }
        .btn-logout {
            background: transparent; border: 1.5px solid var(--azul-escuro);
            color: var(--azul-escuro); padding: 6px 12px; border-radius: 30px;
            font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 5px;
        }
        .btn-logout:hover { background: var(--azul-escuro); color: white; }

        .nav-tabs { display: flex; gap: 4px; padding: 0 1.5rem; background: var(--branco); border-bottom: 1px solid var(--borda); overflow-x: auto; }
        .nav-tab {
            padding: 12px 16px; border: none; background: transparent;
            color: var(--cinza-aco); font-weight: 600; font-size: 0.82rem;
            cursor: pointer; border-bottom: 3px solid transparent;
            transition: 0.2s; display: flex; align-items: center;
            gap: 6px; white-space: nowrap;
        }
        .nav-tab:hover { color: var(--azul-escuro); background: #f8fafd; }
        .nav-tab.active { color: var(--azul-escuro); border-bottom-color: var(--azul-escuro); }

        .content-area { flex: 1; padding: 1.5rem; max-width: 1600px; width: 100%; margin: 0 auto; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--branco); border-radius: 20px; padding: 1.5rem; box-shadow: var(--sombra); border: 1px solid var(--borda); margin-bottom: 1.5rem; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 10px; }
        .card-title {
            font-size: 1.15rem; font-weight: 700; color: var(--azul-escuro);
            display: flex; align-items: center; gap: 10px;
            border-left: 5px solid var(--cinza-aco); padding-left: 12px;
        }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
        .kpi-item { background: var(--fundo-claro); border-radius: 16px; padding: 1.2rem; text-align: center; border-bottom: 3px solid var(--azul-escuro); transition: 0.2s; }
        .kpi-item:hover { transform: translateY(-3px); box-shadow: var(--sombra); }
        .kpi-value { font-size: 1.9rem; font-weight: 800; color: var(--azul-escuro); line-height: 1.2; }
        .kpi-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--cinza-aco2); font-weight: 600; margin-top: 4px; }

        .table-responsive { overflow-x: auto; border-radius: 14px; border: 1px solid var(--borda); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 700px; }
        th { background: #eef3f9; color: var(--azul-escuro); font-weight: 700; padding: 12px 10px; text-align: left; white-space: nowrap; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 12px 10px; border-bottom: 1px solid var(--borda); color: #2f3e4e; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafd; }

        .badge { background: #d9e7f5; color: var(--azul-escuro); padding: 4px 10px; border-radius: 30px; font-weight: 600; font-size: 0.7rem; display: inline-block; white-space: nowrap; }
        .badge-warning { background: var(--amarelo-claro); color: var(--amarelo); }
        .badge-success { background: var(--verde-claro); color: var(--verde); }
        .badge-danger { background: var(--vermelho-claro); color: var(--vermelho); }
        .badge-info { background: #e0ecff; color: var(--azul-escuro); }
        .badge-roxo { background: var(--roxo-claro); color: var(--roxo); }
        .badge-legacy { background: var(--amarelo-claro); color: var(--amarelo); }

        .btn:disabled, .btn[disabled] { opacity: .55; cursor: not-allowed; filter: grayscale(.5); transform: none !important; box-shadow: none !important; }
        .btn { padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; border: none; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
        .btn-primary { background: var(--azul-escuro); color: white; }
        .btn-primary:hover { background: var(--azul-medio); transform: translateY(-2px); }
        .btn-secondary { background: transparent; border: 1.5px solid var(--azul-escuro); color: var(--azul-escuro); }
        .btn-secondary:hover { background: var(--azul-escuro); color: white; }
        .btn-success { background: var(--verde); color: white; }
        .btn-success:hover { background: #155d32; transform: translateY(-2px); }
        .btn-danger { background: var(--vermelho-claro); color: var(--vermelho); border: 1.5px solid #f5c6cb; }
        .btn-danger:hover { background: var(--vermelho); color: white; }
        .btn-warning { background: var(--amarelo); color: white; }
        .btn-warning:hover { background: #924b05; transform: translateY(-2px); }
        .btn-roxo { background: var(--roxo); color: white; }
        .btn-roxo:hover { background: #55307a; transform: translateY(-2px); }
        .btn-lg { padding: 16px 24px; font-size: 1rem; border-radius: 14px; }
        .btn-xl { padding: 20px 28px; font-size: 1.1rem; border-radius: 16px; width: 100%; }
        .barra-progresso { flex: 1; height: 10px; background: var(--borda); border-radius: 6px; overflow: hidden; min-width: 80px; }
        .barra-preenchimento { height: 100%; border-radius: 6px; transition: width .4s; }
        .linha-metrica { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--borda); gap: 12px; flex-wrap: wrap; }
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.75rem; font-weight: 600; color: var(--azul-escuro); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select, .form-group textarea {
            padding: 12px 14px; border: 1.5px solid #d0dbe8; border-radius: 12px;
            font-size: 0.9rem; outline: none; transition: 0.2s; font-family: inherit;
            background: var(--branco); width: 100%;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--azul-escuro); box-shadow: 0 0 0 4px rgba(0, 80, 160, 0.08); }
        .form-actions { display: flex; gap: 10px; margin-top: 1rem; flex-wrap: wrap; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 64, 128, 0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 500; padding: 1rem;
        }
        .modal { background: white; max-width: 700px; width: 100%; padding: 2rem; border-radius: 24px; box-shadow: var(--sombra-forte); max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease; }
        .modal-lg { max-width: 950px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .modal-header h3 { color: var(--azul-escuro); font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
        .modal-close { background: transparent; border: none; font-size: 1.5rem; color: var(--cinza-aco); cursor: pointer; transition: 0.2s; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: var(--vermelho-claro); color: var(--vermelho); }

        .chat-toggle {
            position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px;
            border-radius: 50%; background: var(--azul-escuro); color: white;
            border: none; cursor: pointer; box-shadow: 0 8px 20px rgba(0, 80, 160, 0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; transition: 0.3s; z-index: 300;
        }
        .chat-toggle:hover { background: var(--azul-medio); transform: scale(1.1); }
        .chat-toggle .badge-notif {
            position: absolute; top: -4px; right: -4px;
            background: #e74c3c; color: white; border-radius: 50%;
            width: 22px; height: 22px; font-size: 0.7rem;
            display: flex; align-items: center; justify-content: center; font-weight: 700;
        }
        .chat-panel {
            position: fixed; bottom: 100px; right: 24px;
            width: 420px; max-width: calc(100vw - 48px);
            height: 560px; max-height: calc(100vh - 140px);
            background: white; border-radius: 20px; box-shadow: var(--sombra-forte);
            display: flex; flex-direction: column; overflow: hidden; z-index: 250;
            transform: translateY(20px) scale(0.95); opacity: 0; pointer-events: none;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chat-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: all; }
        .chat-header { background: var(--azul-escuro); color: white; padding: 1rem 1.2rem; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.95rem; }
        .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fbfdff; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 0.83rem; line-height: 1.4; word-break: break-word; }
        .message-in { align-self: flex-start; background: #f0f4fa; color: #1e2b37; border-bottom-left-radius: 4px; border-left: 3px solid var(--cinza-aco); }
        .message-out { align-self: flex-end; background: var(--azul-escuro); color: white; border-bottom-right-radius: 4px; }
        .message-ia { align-self: flex-start; background: #e8f4fd; color: #1e2b37; border-bottom-left-radius: 4px; border-left: 3px solid var(--azul-escuro); }
        .message-info { font-size: 0.62rem; margin-bottom: 3px; opacity: 0.75; display: flex; gap: 6px; align-items: center; }
        .message-out .message-info { color: #d9e7f5; justify-content: flex-end; }
        .chat-input-area { display: flex; padding: 0.8rem; background: white; border-top: 1px solid var(--borda); gap: 8px; }
        .chat-input-area input { flex: 1; padding: 10px 14px; border: 1px solid #d0dbe8; border-radius: 40px; outline: none; font-size: 0.85rem; background: var(--fundo-claro); }
        .btn-send { background: var(--azul-escuro); border: none; color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; flex-shrink: 0; }
        .btn-send:hover { background: var(--azul-medio); }

        .chat-seletor {
            display: flex; gap: 6px; padding: 8px 12px;
            background: var(--fundo-claro); border-bottom: 1px solid var(--borda);
        }
        .chat-seletor button { flex: 1; padding: 8px 10px; border-radius: 10px; border: 1.5px solid transparent; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; background: white; color: var(--cinza-aco); }
        .chat-seletor button.ativo { background: var(--azul-escuro); color: white; border-color: var(--azul-escuro); }
        .chat-setores {
            padding: 8px 12px; background: white; border-bottom: 1px solid var(--borda);
        }
        .chat-setores select {
            width: 100%; padding: 8px 10px; border-radius: 8px;
            border: 1.5px solid #d0dbe8; font-size: 0.8rem; outline: none;
            background: var(--fundo-claro);
        }
        .ia-aviso {
            padding: 8px 12px; background: #e8f4fd; border-bottom: 1px solid var(--borda);
            display: flex; align-items: center; gap: 8px; font-size: 0.78rem;
        }
        .ia-aviso i { color: var(--azul-escuro); font-size: 1.2rem; }
        .ia-aviso strong { color: var(--azul-escuro); display: block; font-size: 0.82rem; }
        .typing-indicator { display: flex; gap: 3px; padding: 8px 12px; }
        .typing-indicator span { width: 8px; height: 8px; border-radius: 50%; background: var(--cinza-aco); animation: bounce 1.4s infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }

        .alert { padding: 12px 16px; border-radius: 12px; margin-bottom: 1rem; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }
        .alert-success { background: var(--verde-claro); color: var(--verde); border-left: 4px solid var(--verde); }
        .alert-error { background: var(--vermelho-claro); color: var(--vermelho); border-left: 4px solid var(--vermelho); }
        .alert-info { background: #d9e7f5; color: var(--azul-escuro); border-left: 4px solid var(--azul-escuro); }
        .alert-warning { background: var(--amarelo-claro); color: var(--amarelo); border-left: 4px solid var(--amarelo); }
        .alert-roxo { background: var(--roxo-claro); color: var(--roxo); border-left: 4px solid var(--roxo); }

        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--cinza-aco); }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; color: #d0dbe8; }
        .empty-state p { font-size: 0.9rem; }

        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .info-block { background: var(--fundo-claro); padding: 1rem; border-radius: 14px; border-left: 4px solid var(--cinza-aco); }
        .info-block-label { font-size: 0.7rem; text-transform: uppercase; color: var(--cinza-aco2); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 4px; }
        .info-block-value { font-size: 1rem; font-weight: 700; color: var(--azul-escuro); }

        .clock-display { background: linear-gradient(135deg, var(--azul-escuro), var(--azul-medio)); color: white; padding: 2rem; border-radius: 20px; text-align: center; margin-bottom: 1.5rem; box-shadow: 0 10px 30px rgba(0, 80, 160, 0.3); }
        .clock-time { font-size: 3.5rem; font-weight: 800; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
        .clock-date { font-size: 1rem; opacity: 0.9; margin-top: 8px; font-weight: 500; letter-spacing: 0.5px; text-transform: capitalize; }
        .clock-label { font-size: 0.75rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; font-weight: 600; }

        .op-card { background: var(--branco); border: 2px solid var(--borda); border-radius: 18px; padding: 1.2rem; margin-bottom: 1rem; transition: 0.2s; }
        .op-card:hover { border-color: var(--azul-escuro); box-shadow: var(--sombra); }
        .op-card.em-andamento { border-color: var(--azul-escuro); background: #f0f7ff; }
        .op-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px; }
        .op-card-numero { font-size: 1.2rem; font-weight: 800; color: var(--azul-escuro); }
        .op-card-produto { font-size: 0.9rem; color: #2f3e4e; margin-top: 4px; }
        .op-card-badge { background: var(--azul-escuro); color: white; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }

        .painel-andamento { background: linear-gradient(135deg, #0050A0, #004395); color: white; padding: 1.5rem; border-radius: 18px; margin-bottom: 1rem; }
        .painel-andamento .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.8; font-weight: 600; }
        .painel-andamento .hora-grande { font-size: 3rem; font-weight: 800; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; margin: 6px 0; }
        .painel-andamento .data-info { font-size: 0.85rem; opacity: 0.9; }

            function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
            function formatDateTime(d) {
                if (!d) return '-';

            }

                if (!inicioISO) return '00:00:00';
                const diff = Date.now() - new Date(inicioISO).getTime();
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

                    if (!pagina) return;
                    const btn = document.createElement('button');
                    btn.className = 'nav-tab' + (paginaKey === currentPage ? ' active' : '');
                    btn.dataset.page = paginaKey;
                    btn.innerHTML = `<i class="fas ${pagina.icon}"></i> ${pagina.label}`;

                    nav.appendChild(btn);

                    case 'laboratorio':        html = pageLaboratorio(); break;
                    case 'qualidade':          html = pageQualidade(); break;
                    case 'mistura_monitor':    html = pageMisturaMonitor(); break;
                    case 'misturadores_admin': html = pageMisturadoresAdmin(); break;
                    case 'operarios':          html = pageOperarios(); break;
                    case 'usuarios':           html = pageUsuarios(); break;
                    case 'produtos':           html = pageProdutos(); break;
                    case 'entradas':           html = pageEntradas(); break;
                    case 'saidas':             html = pageSaidas(); break;
                    case 'lotes':              html = pageLotes(); break;
                    case 'perdas':             html = pagePerdas(); break;
                    case 'eficiencia':         html = pageEficiencia(); break;
                    case 'historico':          html = pageHistorico(); break;
                    case 'chat':               html = pageChatEmbed(); break;
                    default: html = `<div class="card"><div class="empty-state"><i class="fas fa-tools"></i><p>Página em desenvolvimento</p></div></div>`;
                }
                $('#contentArea').innerHTML = html;
                attachPageEvents(paginaKey);
            }

            // ==========================================================
            // CENTRAL DE CONTROLE
            // ==========================================================
            function pageCentralControle() {
                const misturadores = getStorage(KEYS.MISTURADORES, MISTURADORES_DEFAULT);
                const statusLabel = { funcionando: 'Em Funcionamento', standby: 'Em Standby', defeito: 'Com Defeito', desligado: 'Desligado' };
                const statusIcon = { funcionando: 'fa-check-circle', standby: 'fa-pause-circle', defeito: 'fa-exclamation-triangle', desligado: 'fa-power-off' };

                const cards = misturadores.map(m => {
                    const tempoUso = m.inicioUso ? calcularTempoDecorrido(m.inicioUso) : null;
                    const podeDesligar = currentUser.podeCentralControle && m.operador;
                    return `
                        <div class="misturador-card ${m.status}">
                            <div class="misturador-icon"><i class="fas ${statusIcon[m.status]}"></i></div>
                            <div class="misturador-nome">${escapeHtml(m.nome)}</div>
                            <div class="misturador-status">${statusLabel[m.status]}</div>
                            ${m.operadorNome ? `
                                <div class="text-small mt-1" style="color: var(--verde); font-weight: 700;"><i class="fas fa-user-circle"></i> ${escapeHtml(m.operadorNome)}</div>
                                ${m.opAtual ? `<div class="text-small">OP: ${escapeHtml(m.opAtual)}</div>` : ''}
                                ${tempoUso ? `<div class="text-small">Em uso há: <strong>${tempoUso}</strong></div>` : ''}
                            ` : '<div class="text-small mt-1" style="color:#999;">Sem operador</div>'}
                            <div class="misturador-obs">${escapeHtml(m.obs || '')}</div>
                            ${podeDesligar ? `<button class="btn btn-danger btn-sm mt-2" onclick="desligarMaquina('${m.id}')"><i class="fas fa-power-off"></i> Desligar</button>` : ''}
                        </div>
                    `;
                }).join('');

                const funcionando = misturadores.filter(m => m.status === 'funcionando').length;
                const standby = misturadores.filter(m => m.status === 'standby').length;
                const defeito = misturadores.filter(m => m.status === 'defeito').length;
                const desligado = misturadores.filter(m => m.status === 'desligado').length;

                return `
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="fas fa-satellite-dish"></i> Central de Controle</div></div>
                        <div class="kpi-grid">
                            <div class="kpi-item" style="border-bottom-color: var(--verde);"><div class="kpi-value" style="color: var(--verde);">${funcionando}</div><div class="kpi-label">Funcionando</div></div>
                            <div class="kpi-item" style="border-bottom-color: var(--amarelo);"><div class="kpi-value" style="color: var(--amarelo);">${standby}</div><div class="kpi-label">Standby</div></div>
                            <div class="kpi-item" style="border-bottom-color: var(--vermelho);"><div class="kpi-value" style="color: var(--vermelho);">${defeito}</div><div class="kpi-label">Com Defeito</div></div>
                            <div class="kpi-item" style="border-bottom-color: #666;"><div class="kpi-value" style="color: #666;">${desligado}</div><div class="kpi-label">Desligadas</div></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="fas fa-industry"></i> Status em Tempo Real</div></div>
                        <div class="misturadores-grid">${cards}</div>
                    </div>
                `;
            }

            window.desligarMaquina = function(id) {
                if (!currentUser.podeCentralControle) { alert('Acesso restrito.'); return; }
                const misturadores = getStorage(KEYS.MISTURADORES, MISTURADORES_DEFAULT);
                const m = misturadores.find(x => x.id === id);
                if (!m) return;
                if (!confirm(`Desligar ${m.nome}?`)) return;
                m.status = 'desligado'; m.operador = null; m.operadorNome = null;
                m.opAtual = null; m.inicioUso = null;
                m.obs = `Desligado por ${currentUser.nome}`;
                setStorage(KEYS.MISTURADORES, misturadores);
                registrarLog('Máquina Desligada', `${m.nome}`, 'amarelo');
                renderPage(currentPage);
            };

            // ==========================================================
            // QUALIDADE
            // ==========================================================
            function pageQualidade() {
                if (currentUser.cargo !== 'tecnico_quimica' && currentUser.cargo !== 'admin') {
                    return `<div class="card"><div class="empty-state"><i class="fas fa-lock"></i><p>Acesso restrito</p></div></div>`;
                }
                const ops = getStorage(KEYS.OPS).map(normalizarStatusOP);
                const aguardando = ops.filter(o => o.status === 'Em Qualidade');
                const emMistura = ops.filter(o => o.status === 'Em Mistura');

                let listaAguardando = aguardando.length === 0
                    ? `<div class="empty-state"><i class="fas fa-vial"></i><p>Nenhuma OP aguardando qualidade</p></div>`
                    : aguardando.map(o => `
                        <div class="op-card">
                            <div class="op-card-header">
                                <div>
                                    <div class="op-card-numero">${o.numero}</div>
                                    <div class="op-card-produto"><strong>${escapeHtml(o.produto)}</strong></div>
                                    <div class="text-small mt-1">Qtd: ${o.quantidade} | Lote: ${escapeHtml(o.lote)}</div>
                                </div>
                                <div class="op-card-badge" style="background: var(--roxo);">Aguardando Qualidade</div>
                            </div>
                            <button class="btn btn-roxo btn-xl" onclick="abrirQualidade('${o.id}')"><i class="fas fa-vial"></i> Analisar Qualidade</button>
                        </div>
                    `).join('');

                let listaMonitor = emMistura.length === 0
                    ? `<div class="empty-state"><i class="fas fa-check-circle" style="color: var(--verde);"></i><p>Nenhuma mistura em andamento</p></div>`
                    : emMistura.map(o => {
                        const seg = getSegDecorridos(o);
                        const tMin = getTempoMinimoSeg(o, 'mistura');
                        const pct = tMin ? Math.min(100, (seg / tMin) * 100) : 100;
                        return `<div class="linha-metrica">
                            <div style="min-width:200px;">
                                <div style="font-weight:600;">${o.numero} - ${escapeHtml(o.produto)}</div>
                                <div class="text-small">Operador: ${escapeHtml(o.inicioTrabalho?.operador || '-')}</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px; flex:1;">
                                <div class="barra-progresso"><div class="barra-preenchimento" style="width:${pct}%; background: var(--azul-escuro);"></div></div>
                                <span style="font-weight:700; color: var(--azul-escuro); min-width:90px; text-align:right;">${calcularTempoDecorrido(o.inicioTrabalho?.timestamp)}</span>
                            </div>
                        </div>`;
                    }).join('');

                return `
                    <div class="alert alert-roxo"><i class="fas fa-vial"></i><div><strong>Análise de Qualidade</strong><br><span class="text-small">Verifique antes de enviar para o envase.</span></div></div>
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="fas fa-vial"></i> OPs Aguardando Qualidade</div></div>
                        ${listaAguardando}
                    </div>
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="fas fa-chart-area"></i> Monitor de Mistura</div></div>
                        ${listaMonitor}
                    </div>
                `;
            }

            window.abrirQualidade = function(opId) {
                if (currentUser.cargo !== 'tecnico_quimica' && currentUser.cargo !== 'admin') return;
                const op = getStorage(KEYS.OPS).find(o => o.id === opId);
                if (!op) return;
                const formula = CATALOGO[op.produto] || CATALOGO[PRODUTO_PADRAO];
                const formulaHtml = formula.mistura.itens.map(i => `<div class="formula-item"><span class="name">${i.nome}</span><span class="value">${i.quantidade}</span></div>`).join('');

                openModal(`
                    <div class="modal-header"><h3><i class="fas fa-vial"></i> Qualidade - ${op.numero}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
                    <div class="info-grid">
                        <div class="info-block"><div class="info-block-label">Produto</div><div class="info-block-value">${escapeHtml(op.produto)}</div></div>
                        <div class="info-block"><div class="info-block-label">Qtd</div><div class="info-block-value">${op.quantidade}</div></div>
                        <div class="info-block"><div class="info-block-label">Lote</div><div class="info-block-value">${escapeHtml(op.lote)}</div></div>
                    </div>
                    ${op.registros?.mistura ? `
                        <h4 style="color: var(--azul-escuro); margin: 1rem 0 0.5rem;"><i class="fas fa-flask"></i> Dados da Mistura</h4>
                        <div class="info-grid">
                            <div class="info-block"><div class="info-block-label">Densidade Inicial</div><div class="info-block-value">${op.registros.mistura.dados.densidadeInicial}</div></div>
                            <div class="info-block"><div class="info-block-label">Densidade Final</div><div class="info-block-value">${op.registros.mistura.dados.densidadeFinal}</div></div>
                            <div class="info-block"><div class="info-block-label">pH</div><div class="info-block-value">${op.registros.mistura.dados.ph}</div></div>
                        </div>
                    ` : ''}
                    <div class="formula-box">
                        <div class="formula-title"><i class="fas fa-prescription-bottle"></i> Fórmula Química</div>
                        ${formulaHtml}
                    </div>
                    <form onsubmit="salvarQualidade(event, '${op.id}')">
                        <h4 style="color: var(--roxo); margin: 1rem 0 0.5rem;"><i class="fas fa-clipboard-check"></i> Teste de Qualidade</h4>
                        <div class="form-grid">
                            <div class="form-group"><label>Viscosidade *</label>
                                <select name="viscosidade" required><option value="">Selecione</option><option>OK</option><option>Fora do padrão</option></select>
                            </div>
                            <div class="form-group"><label>pH Verificado *</label><input type="number" name="phVerificado" step="0.1" required></div>
                            <div class="form-group"><label>Densidade Verificada *</label><input type="number" name="densidadeVerificada" step="0.01" required></div>
                            <div class="form-group"><label>Aspecto Visual *</label>
                                <select name="aspecto" required><option value="">Selecione</option><option>Conforme</option><option>Não conforme</option></select>
                            </div>
                            <div class="form-group" style="grid-column: 1 / -1;"><label>Observações Técnicas</label><textarea name="observacoes" rows="2"></textarea></div>
                            <div class="form-group" style="grid-column: 1 / -1;"><label>Resultado *</label>
                                <select name="resultado" required>
                                    <option value="">Selecione</option>
                                    <option>Aprovado - Enviar para Envase</option>
                                    <option>Reprovado - Retroceder para Mistura</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-roxo btn-xl"><i class="fas fa-check-circle"></i> Registrar Análise</button>
                            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                        </div>
                    </form>
                `, true);
            };

            window.salvarQualidade = function(e, opId) {
                e.preventDefault();
                const d = Object.fromEntries(new FormData(e.target));
                const ops = getStorage(KEYS.OPS);
                const op = ops.find(o => o.id === opId);
                if (!op) return;

                op.qualidade = { analisadoPor: currentUser.nome, cargo: currentUser.cargoLabel, timestamp: new Date().toISOString(), dados: d, resultado: d.resultado };
                op.historico = op.historico || [];

                if (d.resultado.startsWith('Aprovado')) {
                    op.status = 'Em Envase';
                    op.historico.push({ setor: currentUser.nome, acao: 'Qualidade Aprovada', timestamp: new Date().toISOString() });
                    registrarLog('Qualidade Aprovada', `OP ${op.numero}`, 'verde');
                } else {
                    op.status = 'Aguardando Mistura';
                    op.historico.push({ setor: currentUser.nome, acao: 'Qualidade Reprovada - RETROCEDIDA para Mistura', timestamp: new Date().toISOString() });
                    registrarLog('Qualidade Reprovada', `OP ${op.numero} RETROCEDIDA`, 'vermelho');
                }

                setStorage(KEYS.OPS, ops);
                closeModal();
                renderPage(currentPage);
                alert(d.resultado.startsWith('Aprovado') ? '✅ Aprovada!' : '⚠️ Reprovada e retrocedida!');
            };

            // ==========================================================
            // MONITOR DE MISTURA
            // ==========================================================
            function pageMisturaMonitor() {
                if (currentUser.cargo !== 'tecnico_quimica' && currentUser.cargo !== 'admin') {
                    return `<div class="card"><div class="empty-state"><i class="fas fa-lock"></i><p>Acesso restrito</p></div></div>`;
                }
                const ops = getStorage(KEYS.OPS).map(normalizarStatusOP);
                const emMistura = ops.filter(o => o.status === 'Em Mistura');
                let lista = emMistura.length === 0
                    ? `<div class="empty-state"><i class="fas fa-flask"></i><p>Nenhuma mistura em andamento</p></div>`
                    : emMistura.map(o => {
                        const seg = getSegDecorridos(o);
                        const tMin = getTempoMinimoSeg(o, 'mistura');
                        const pct = tMin ? Math.min(100, (seg / tMin) * 100) : 100;
                        const prod = CATALOGO[o.produto] || CATALOGO[PRODUTO_PADRAO];
                        const massaTotal = prod.mistura.itens.reduce((acc, i) => {
                            const m = i.quantidade.match(/([\d,]+)/);
                            if (m) {
                                const v = parseFloat(m[1].replace(',', '.'));
                                return acc + (i.quantidade.includes('kg') ? v : 0);
                            }
                            return acc;
                        }, 0);
                        return `
                            <div class="card" style="background: var(--fundo-claro); box-shadow: none; margin-bottom: 1rem;">
                                <div class="flex-between"><h4 style="color: var(--azul-escuro);">${o.numero} - ${escapeHtml(o.produto)}</h4><div class="badge badge-info">Em Mistura</div></div>
                                <div class="tempo-decorrido mt-2"><div class="label"><i class="fas fa-stopwatch"></i> Tempo</div><div class="valor">${calcularTempoDecorrido(o.inicioTrabalho?.timestamp)}</div></div>
                                <div class="linha-metrica">
                                    <div style="min-width:180px;">Progresso</div>
                                    <div style="display:flex; align-items:center; gap:10px; flex:1;">
                                        <div class="barra-progresso"><div class="barra-preenchimento" style="width:${pct}%; background: var(--azul-escuro);"></div></div>
                                        <span style="font-weight:700;">${pct.toFixed(0)}%</span>
                                    </div>
                                </div>
                                <div class="info-grid mt-2">
                                    <div class="info-block"><div class="info-block-label">Massa Total</div><div class="info-block-value">${(massaTotal * o.quantidade).toFixed(1)} kg</div></div>
                                    <div class="info-block"><div class="info-block-label">Rotação</div><div class="info-block-value">${prod.mistura.rpm} rpm</div></div>
                                    <div class="info-block"><div class="info-block-label">Operador</div><div class="info-block-value">${escapeHtml(o.inicioTrabalho?.operador || '-')}</div></div>
                                </div>
                            </div>`;
                    }).join('');

                return `
                    <div class="alert alert-roxo"><i class="fas fa-chart-area"></i><div><strong>Monitoramento de Mistura</strong></div></div>
                    <div class="card"><div class="card-header"><div class="card-title"><i class="fas fa-chart-area"></i> Misturas em Andamento</div></div>${lista}</div>
                `;
            }

            // ==========================================================
            // INÍCIO GESTOR
            // ==========================================================
            function pageInicioGestor() {
                const ops = getStorage(KEYS.OPS).map(normalizarStatusOP);
                const opsAndamento = ops.filter(o => o.status !== 'Encerrada').length;
                const ef = calcularEficiencia();
                const legacyBadge = currentUser.legacy ? '<span class="badge badge-legacy" style="margin-left:8px;"><i class="fas fa-history"></i> Conta Legada</span>' : '';

                return `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title"><i class="fas fa-home"></i> Bem-vindo, ${escapeHtml(currentUser.nome)} ${legacyBadge}</div>
                            <div class="badge badge-info">${currentUser.cargoLabel} • ${currentUser.turno}</div>
                        </div>
                        <div class="clock-display" id="relogioGestor">
                            <div class="clock-label"><i class="fas fa-clock"></i> Hora atual</div>
                            <div class="clock-time">--:--:--</div>
                            <div class="clock-date">Carregando...</div>
                        </div>
                        <div class="kpi-grid">
                            <div class="kpi-item"><div class="kpi-value">${opsAndamento}</div><div class="kpi-label">OPs em Andamento</div></div>
                            <div class="kpi-item" style="border-bottom-color:var(--azul-escuro);"><div class="kpi-value" style="color:var(--azul-escuro);">${ef.rendimento}%</div><div class="kpi-label">Rendimento</div></div>
                            <div class="kpi-item" style="border-bottom-color:${ef.perdaMedia > 3 ? 'var(--vermelho)' : 'var(--cinza-aco)'};"><div class="kpi-value" style="color:${ef.perdaMedia > 3 ? 'var(--vermelho)' : 'var(--cinza-aco)'};">${ef.perdaMedia}%</div><div class="kpi-label">Perda Média</div></div>
                            <div class="kpi-item" style="border-bottom-color:var(--verde);"><div class="kpi-value" style="color:var(--verde);">${ef.encerradas}</div><div class="kpi-label">Encerradas</div></div>
                        </div>
                        ${currentUser.legacy ? `
                            <div class="alert alert-warning mt-2">
                                <i class="fas fa-history"></i>
                                <div>
                                    <strong>Você está usando uma conta de compatibilidade</strong><br>
                                    <span class="text-small">Esta conta foi mantida para compatibilidade com versões anteriores. Todas as funcionalidades estão ativas.</span>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            // ==========================================================
            // INÍCIO OPERÁRIO
            // ==========================================================
            function pageInicioOperario() {
                const ops = getStorage(KEYS.OPS).map(normalizarStatusOP);
                const setor = currentUser.setor;
                const config = getConfigSetor(setor);
                const misturadores = getStorage(KEYS.MISTURADORES, MISTURADORES_DEFAULT);
                const minhaMaquina = misturadores.find(m => m.operador === currentUser.email);

                let maquinaHtml = '';
                if (minhaMaquina) {
                    const tempo = minhaMaquina.inicioUso ? calcularTempoDecorrido(minhaMaquina.inicioUso) : '00:00:00';
                    maquinaHtml = `<div class="card" style="background: var(--verde-claro); border-color: var(--verde);">
                        <div class="flex-between">
                            <div>
                                <div style="font-weight:700; color: var(--verde);"><i class="fas fa-check-circle"></i> Você está operando</div>
                                <div style="font-size:1.3rem; font-weight:800; color: var(--azul-escuro);">${escapeHtml(minhaMaquina.nome)}</div>
                                <div class="text-small">Tempo em uso: <strong>${tempo}</strong></div>
                            </div>
                            <button class="btn btn-danger" onclick="deslogarMaquina('${minhaMaquina.id}')"><i class="fas fa-power-off"></i> Encerrar Uso</button>
                        </div>
                    </div>`;
                } else {
                    const disp = misturadores.filter(m => !m.operador && m.status !== 'defeito' && m.status !== 'desligado');
                    maquinaHtml = `<div class="card" style="background: var(--amarelo-claro); border-color: var(--amarelo);">
                        <div class="card-header"><div class="card-title"><i class="fas fa-exclamation-triangle"></i> Você não está em nenhuma máquina</div></div>
                        ${disp.length === 0 ? '<div class="alert alert-warning"><i class="fas fa-info-circle"></i> Nenhuma máquina disponível</div>' : `
                            <div class="form-group">
                                <label>Selecionar Máquina *</label>
                                <select id="selectMaquina"><option value="">Escolha...</option>${disp.map(m => `<option value="${m.id}">${escapeHtml(m.nome)} - ${m.status}</option>`).join('')}</select>
                            </div>
                            <button class="btn btn-success btn-lg mt-2" onclick="logarMaquina()"><i class="fas fa-play"></i> Iniciar Operação</button>
                        `}
                    </div>`;
                }

                let opsAguardando = [], opsEmAndamento = [];
                if (setor === 'mistura') {
                    opsAguardando = ops.filter(o => o.status === 'Aguardando Mistura');
                    opsEmAndamento = ops.filter(o => o.status === 'Em Mistura' && o.operadorAtual === currentUser.email);
                } else if (setor === 'envase') {
                    opsAguardando = ops.filter(o => o.status === 'Em Envase' && !o.operadorAtual);
                    opsEmAndamento = ops.filter(o => o.status === 'Em Envase' && o.operadorAtual === currentUser.email);
                }

                let listaAguardando = opsAguardando.length === 0
                    ? `<div class="empty-state"><i class="fas fa-check-circle" style="color: var(--verde);"></i><p>Nenhuma OP aguardando</p></div>`
                    : opsAguardando.map(o => `
                        <div class="op-card">
                            <div class="op-card-header">
                                <div>
                                    <div class="op-card-numero">${o.numero}</div>
                                    <div class="op-card-produto"><strong>${escapeHtml(o.produto)}</strong></div>
                                    <div class="text-small mt-1">Qtd: ${o.quantidade} | Lote: ${escapeHtml(o.lote)}</div>
                                </div>
                                <div class="op-card-badge">Aguardando</div>
                            </div>
                            ${!minhaMaquina ? '<div class="alert alert-warning" style="margin-bottom:0.75rem;"><i class="fas fa-info-circle"></i> Registre-se em uma máquina primeiro</div>' : ''}
                            <button class="btn btn-primary btn-xl" onclick="iniciarTrabalho('${o.id}')" ${!minhaMaquina ? 'disabled' : ''}><i class="fas fa-play"></i> Iniciar ${config.nomeTarefa}</button>
                        </div>
                    `).join('');

                let listaEmAndamento = opsEmAndamento.length > 0 ? `
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="fas fa-hourglass-half"></i> Em Andamento</div></div>
                        ${opsEmAndamento.map(o => {
                            const tempo = calcularTempoDecorrido(o.inicioTrabalho?.timestamp);
                            return `
                                <div class="op-card em-andamento">
                                    <div class="op-card-header">
                                        <div>
                                            <div class="op-card-numero">${o.numero}</div>
                                            <div class="op-card-produto"><strong>${escapeHtml(o.produto)}</strong></div>
                                        </div>

            window.deslogarMaquina = function(maquinaId) {
                const ms = getStorage(KEYS.MISTURADORES, MISTURADORES_DEFAULT);

                if (!m) return;

                m.opAtual = null; m.status = 'standby'; m.obs = 'Aguardando operador';

            window.editarUsuario = function(id) {
                if (!currentUser.podeCadastrarUsuario) return;
                const us = getUsuarios();
                const u = us.find(x => x.id === id);
                if (!u) return;
                const opts = Object.entries(CARGOS).map(([k, c]) => `<option value="${k}" ${u.cargo === k ? 'selected' : ''}>${c.label}</option>`).join('');

                            <div class="form-group"><label>Nome *</label><input type="text" name="nome" required value="${escapeHtml(u.nome)}"></div>

                const i = us.findIndex(x => x.id === id);
                if (i === -1) return;
                us[i] = { ...us[i], ...d };
                setStorage(KEYS.USUARIOS, us);
                registrarLog('Usuário Atualizado', `${d.nome}`, 'info');
                closeModal();
                popularLogin();
                renderPage(currentPage);

            window.excluirUsuario = function(id) {
                if (!currentUser.podeCadastrarUsuario) return;
                const us = getUsuarios();
                const u = us.find(x => x.id === id);
                if (!u || u.legacy) return;
                if (!confirm(`Excluir ${u.nome}?`)) return;
                setStorage(KEYS.USUARIOS, us.filter(x => x.id !== id));
                registrarLog('Usuário Excluído', `${u.nome}`, 'vermelho');
                popularLogin();
                renderPage(currentPage);
            };

                if (!currentUser.podeCadastrarProduto) return;
                if (!confirm('Excluir?')) return;
                const ps = getStorage(KEYS.PRODUTOS);
                const p = ps.find(x => x.id === id);
                setStorage(KEYS.PRODUTOS, ps.filter(x => x.id !== id));
                registrarLog('Produto Excluído', `${p?.nome}`, 'vermelho');
                renderPage(currentPage);
            };

            // ==========================================================
            // RETROCEDER
            // ==========================================================
            window.retrocederProcesso = function(opId) {
                if (!currentUser.podeRetroceder) { alert('Acesso restrito.'); return; }
                const ops = getStorage(KEYS.OPS);
                const op = ops.find(o => o.id === opId);
                if (!op) return;
                let anterior = null;
                if (op.status === 'Em Qualidade') anterior = 'Em Mistura';
                else if (op.status === 'Em Envase') anterior = 'Em Qualidade';
                else if (op.status === 'Em Laboratório') anterior = 'Em Envase';
                else if (op.status === 'Encerrada') anterior = 'Em Laboratório';
                else if (op.status === 'Em Mistura') anterior = 'Aguardando Mistura';
                else { alert('Não é possível retroceder de: ' + op.status); return; }

                openModal(`
                    <div class="modal-header"><h3><i class="fas fa-undo"></i> Retroceder ${op.numero}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
                    <div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i><strong>${op.status} → ${anterior}</strong></div>
                    <form onsubmit="confirmarRetroceder(event, '${op.id}', '${anterior}')">
                        <div class="form-group"><label>Motivo *</label><textarea name="motivo" rows="3" required></textarea></div>
                        <div class="form-group mt-2"><label>Tipo de Falha *</label>
                            <select name="tipoFalha" required><option value="">Selecione</option>
                            <option>Falha de Qualidade</option><option>Falha de Mistura</option><option>Falha de Envase</option>
                            <option>Falha de Matéria-Prima</option><option>Contaminação</option><option>Erro de Processo</option><option>Outro</option></select>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-danger"><i class="fas fa-undo"></i> Confirmar</button>
                            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                        </div>
                    </form>
                `);
            };

            window.confirmarRetroceder = function(e, opId, anterior) {
                e.preventDefault();
                const d = Object.fromEntries(new FormData(e.target));
                const ops = getStorage(KEYS.OPS);
                const op = ops.find(o => o.id === opId);
                if (!op) return;
                const orig = op.status;
                op.status = anterior;
                delete op.operadorAtual;
                op.historico = op.historico || [];
                op.historico.push({ setor: currentUser.nome, acao: `🔴 RETROCESSO: ${orig} → ${anterior} | ${d.motivo} | ${d.tipoFalha}`, timestamp: new Date().toISOString(), tipo: 'retrocesso' });
                setStorage(KEYS.OPS, ops);
                registrarLog('Processo Retrocedido', `${op.numero}: ${orig} → ${anterior}`, 'vermelho');
                closeModal();
                renderPage(currentPage);
                alert(`⚠️ OP retrocedida!`);
            };

            // ==========================================================
            // PCP
            // ==========================================================
            function pageOPsPCP() {
                const ops = getStorage(KEYS.OPS).map(normalizarStatusOP);
                let lista = ops.length === 0
                    ? `<div class="empty-state"><i class="fas fa-clipboard-list"></i><p>Nenhuma OP</p></div>`
                    : `<div class="table-responsive"><table>
                        <thead><tr><th>Nº OP</th><th>Produto</th><th>Qtd</th><th>Lote</th><th>Status</th><th>Operador</th><th>Ações</th></tr></thead>
                        <tbody>
                            ${ops.map(o => `<tr>
                                <td><strong>${escapeHtml(o.numero)}</strong></td>
                                <td>${escapeHtml(o.produto)}</td>
                                <td>${o.quantidade}</td>
                                <td><span class="badge">${escapeHtml(o.lote)}</span></td>
                                <td><span class="badge ${statusBadgeClass(o.status)}">${o.status}</span></td>

                                <td>
                                    <button class="btn btn-sm btn-secondary" onclick="verOP('${o.id}')"><i class="fas fa-eye"></i></button>
                                    ${currentUser.podeRetroceder && o.status !== 'Aguardando Mistura' ? `<button class="btn btn-sm btn-danger" onclick="retrocederProcesso('${o.id}')"><i class="fas fa-undo"></i></button>` : ''}
                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table></div>`;

                return `
                    <div class="alert alert-info"><i class="fas fa-info-circle"></i>
                        <strong>PCP:</strong> Fluxo: PCP → Mistura → Qualidade → Envase → Laboratório.</div>
                    <div class="card">
                        <div class="card-header"><div class="card-title"><i class="fas fa-tasks"></i> Painel do PCP</div>
                        <button class="btn btn-primary" id="btnNovaOP"><i class="fas fa-plus"></i> Nova OP</button></div>
                        ${lista}
                    </div>`;
            }

            window.verOP = function(id) {
                const op = getStorage(KEYS.OPS).find(o => o.id === id);
                if (!op) return;
                const etapa = FLUXO_OP.findIndex(f => f.status === op.status);
                let tl = '<div class="timeline-op">';
                FLUXO_OP.forEach((e, i) => {
                    let c = i < etapa ? 'completa' : i === etapa ? 'atual' : '';
                    tl += `<div class="timeline-etapa ${c}"><div class="timeline-circle"><i class="fas ${e.icon}"></i></div><div class="timeline-label">${e.label}</div></div>`;
                });
                tl += '</div>';

                let regs = '';
                if (op.registros) {
                    for (const [s, d] of Object.entries(op.registros)) {
                        regs += `<div class="alert alert-info"><i class="fas fa-check-circle"></i><div><strong>${s.toUpperCase()}:</strong><br>
                            Início: ${d.inicio?.hora || '-'}<br>Término: ${d.fim?.hora || '-'}<br>Tempo: ${d.fim?.tempoDecorrido || '-'}<br>Operador: ${escapeHtml(d.fim?.operador || '-')}</div></div>`;
                    }
                }

                let qual = '';
                if (op.qualidade) {
                    qual = `<h4 style="color: var(--roxo); margin: 1rem 0 0.5rem;"><i class="fas fa-vial"></i> Qualidade</h4>
                        <div class="info-grid">
                            <div class="info-block"><div class="info-block-label">Analisado por</div><div class="info-block-value">${escapeHtml(op.qualidade.analisadoPor)}</div></div>
                            <div class="info-block"><div class="info-block-label">Resultado</div><div class="info-block-value">${escapeHtml(op.qualidade.resultado)}</div></div>
                        </div>`;
                }

                let hist = '';
                if (op.historico?.length > 0) {
                    hist = `<h4 style="color: var(--azul-escuro); margin: 1rem 0 0.5rem;"><i class="fas fa-history"></i> Histórico</h4>
                        <div class="table-responsive"><table>
                            <thead><tr><th>Setor</th><th>Ação</th><th>Data/Hora</th></tr></thead>
                            <tbody>${op.historico.map(h => `<tr><td><strong>${escapeHtml(h.setor)}</strong></td><td>${escapeHtml(h.acao)}</td><td class="text-small">${formatDateTime(h.timestamp)}</td></tr>`).join('')}</tbody>
                        </table></div>`;
                }

                openModal(`
                    <div class="modal-header"><h3><i class="fas fa-clipboard-list"></i> ${op.numero}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
                    ${tl}
                    <div class="info-grid">
                        <div class="info-block"><div class="info-block-label">Produto</div><div class="info-block-value">${escapeHtml(op.produto)}</div></div>
                        <div class="info-block"><div class="info-block-label">Qtd</div><div class="info-block-value">${op.quantidade}</div></div>
                        <div class="info-block"><div class="info-block-label">Lote</div><div class="info-block-value">${escapeHtml(op.lote)}</div></div>
                        <div class="info-block"><div class="info-block-label">Status</div><div class="info-block-value"><span class="badge ${statusBadgeClass(op.status)}">${op.status}</span></div></div>
                    </div>
                    ${regs}${qual}${hist}
                    <div class="form-actions">
                        ${currentUser.podeRetroceder && op.status !== 'Aguardando Mistura' ? `<button class="btn btn-danger" onclick="closeModal(); retrocederProcesso('${op.id}')"><i class="fas fa-undo"></i> Retroceder</button>` : ''}
